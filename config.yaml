# KnowSeq Agent 配置文件（非敏感项；敏感项放 .env，见 .env.example）
web:
  port: 8765          # 极简控制台端口（仅本机监听）

paths:
  inbox_dir: "inbox"  # 原始素材根目录（相对项目根，只追加不修改）
  drop_dir: "drop"    # 文件热文件夹：拖入的文件会被自动采集（相对项目根）

sources:
  screen:             # REQ-104 screenpipe（屏幕+音频，官方 Python 包）
    enabled: false
  clipboard:          # REQ-105 剪贴板监控（微信/企微对话）
    enabled: true
    interval: 2       # 轮询间隔（秒）
    max_len: 50000    # 单条文本截断上限（字符）
  feishu:             # REQ-106 飞书（需在 .env 配置凭据）
    enabled: false
  file:               # REQ-107 文件监听
    enabled: true
    dirs: []          # 额外监听目录（绝对路径，可空）
  web:                # REQ-108 网页抓取（控制台输入 URL 触发）
    enabled: true
