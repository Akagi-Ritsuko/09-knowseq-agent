web:
  port: 8765
  auto_start: true
app:
  autostart: false
paths:
  inbox_dir: inbox
  drop_dir: drop
  knowledge_dir: knowledge
compile:
  enabled: true
  auto: true
  poll_interval: 30
  llm:
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    model: deepseek-v4-flash
    temperature: 0.7
    max_context: 204800
    streaming: true
    request_timeout_min: 30
    ingest_reasoning: false
  output_language: zh
  queue:
    concurrency: 1
    max_retries: 3
  lint:
    semantic: false
  dedup:
    threshold: 0.68
brain:
  enabled: true
  embedding:
    mode: local
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: ''
    dim: 0
    model_dir: models/embed/bge-small-zh-v1.5
  llm:
    base_url: ''
    model: ''
sources:
  meeting:
    enabled: true
    engine_path: tools/vibeasr/build/bin/asr_infer.exe
    model_dir: models/vibeasr
  system_audio:
    enabled: true
    segment_seconds: 300
    include_mic: false
  clipboard:
    enabled: true
    interval: 2
    max_len: 50000
  feishu:
    enabled: true
  file:
    enabled: true
    dirs: []
  web:
    enabled: true
